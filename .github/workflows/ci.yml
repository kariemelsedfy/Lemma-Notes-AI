name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: Packages/*/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Packages/**/Package.swift') }}
      - name: Install tools
        run: ./scripts/bootstrap.sh
      - name: Lint
        run: ./scripts/lint.sh
      - name: Generate project
        run: ./scripts/generate.sh
      - name: Verify module dependency boundaries
        run: ./scripts/check-module-dependencies.sh
      - name: Run package tests and app build
        run: ./scripts/test.sh
      - name: Run app tests
        run: xcodebuild test -workspace Margin.xcworkspace -scheme Margin -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=latest' CODE_SIGNING_ALLOWED=NO
